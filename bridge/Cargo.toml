[package]
name = "deerflow-acp-bridge"
version = "0.1.0"
edition = "2024"
description = "Native stdio bridge for the long-lived local DeerFlow ACP daemon"
license = "MIT"

[[bin]]
name = "deerflow-acp"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
