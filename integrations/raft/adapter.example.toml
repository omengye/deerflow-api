[raft]
# Install with: npm install -g @botiverse/raft@latest
command = "raft"
args = []
profile = "deerflow"
# Agent id shown by Raft's External Setup card, not its display name.
agent_id = "00000000-0000-0000-0000-000000000000"
start_bridge = true

[deerflow]
# The executable from the extracted DeerFlow Portable directory.
command = "D:\\Apps\\DeerFlow\\deerflow-acp.exe"
args = []
# Existing local directory used as session/new.cwd for every Raft conversation.
workspace = "D:\\RaftWorkspaces\\DeerFlow"
timeout_seconds = 600

[state]
path = "./data/adapter.sqlite3"

[wake]
host = "127.0.0.1"
port = 47821
# Empty generates an in-memory token and passes it to the bridge process.
token = ""
runtime_session = "deerflow-acp"

[adapter]
poll_interval_seconds = 30
bridge_restart_seconds = 3
# Retry only Raft Agent API transport failures. Delays are exponential and
# capped; authentication, HTTP, and CLI usage errors are not retried.
inbox_transport_retry_attempts = 3
inbox_transport_retry_base_seconds = 1
inbox_transport_retry_max_seconds = 4
# Stop retrying a message after this many ACP or Raft delivery failures.
max_message_attempts = 5
log_level = "INFO"
