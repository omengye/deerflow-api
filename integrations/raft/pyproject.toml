[project]
name = "raft-deerflow-adapter"
version = "0.1.0"
description = "Connect a Raft External Agent to DeerFlow Portable over ACP v1"
requires-python = ">=3.12"
dependencies = [
    "agent-client-protocol>=0.10,<0.11",
]

[project.scripts]
raft-deerflow-adapter = "raft_deerflow_adapter.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["raft_deerflow_adapter"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

