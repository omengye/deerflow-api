[project]
name = "deerflow-api"
version = "0.1.0"
description = "API service wrapper for DeerFlow agent harness"
requires-python = ">=3.12"
dependencies = [
    # API service
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "sse-starlette>=2.1.0",
    "python-multipart>=0.0.26",
    "pydantic>=2.0.0",
    # DeerFlow harness (embedded)
    "agent-client-protocol>=0.4.0",
    "agent-sandbox>=0.0.19",
    "dotenv>=0.9.9",
    "httpx>=0.28.0",
    "langchain>=1.2.3",
    "langchain-openai>=1.1.7",
    "langchain-anthropic>=1.3.4",
    "langchain-mcp-adapters>=0.1.0",
    "langgraph>=1.0.6",
    "langgraph-api>=0.7.0",
    "langgraph-cli>=0.4.14",
    "langgraph-runtime-inmem>=0.22.1",
    "langgraph-checkpoint-sqlite>=3.0.3",
    "langgraph-sdk>=0.3.0",
    "langfuse>=3.4.1",
    "markdownify>=1.2.2",
    "tiktoken>=0.8.0",
    "langchain-google-genai>=4.2.1",
    "langchain-deepseek>=1.0.1",
    "pyyaml>=6.0.3",
    "readabilipy>=0.3.0",
]

[project.optional-dependencies]
ollama = ["langchain-ollama>=0.3.0"]
pymupdf = ["pymupdf4llm>=0.0.17"]
sandbox-docker = ["kubernetes>=30.0.0"]
file-convert = ["markitdown>=0.1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "deerflow", "packages/deerflow_sdk"]

[tool.hatch.build.targets.wheel.sources]
"packages/deerflow_sdk" = "deerflow_sdk"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["packages", "."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "mypy>=1.13.0",
]
