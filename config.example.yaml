# DeerFlow config.yaml
# ⚠️ 配置你的 API Key 后再启动服务

config_version: 11
log_level: info

# API service settings. Prefer putting operational configuration here instead
# of .env. Environment variables are still supported as compatibility fallbacks
# when a field is omitted.
api:
  host: 0.0.0.0
  port: 8000
  checkpointer_type: sqlite
  checkpointer_path: ./data/checkpoints.db
  model_name: null
  thinking_enabled: true
  subagent_enabled: true
  plan_mode: true
  max_concurrent_subagents: 3
  data_dir: ./data
  deerflow_home: ./data/deerflow
  deerflow_host_base_dir: null
  extensions_config_path: null
  cors_allow_origins:
    - http://localhost:3000
    - http://127.0.0.1:3000
  cors_allow_credentials: false
  # Set api_keys to enable Bearer-token auth, or set auth_enabled explicitly.
  api_keys: []
  auth_enabled: false
  chat_request_timeout: 600
  max_upload_size_mb: 25
  max_uploads_per_request: 10
  # Empty list = allow any extension. Example: [.pdf, .txt, .md]
  allowed_upload_extensions: []
  allow_memory_fallback: false

token_usage:
  enabled: false

models:
  - name: qwen3.6-plus
    display_name: Qwen 3.6 Plus
    use: langchain_openai:ChatOpenAI
    model: qwen3.6-plus
    api_key: "YOUR_DASHSCOPE_API_KEY"
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    supports_thinking: true

default_model: qwen3.6-plus

sandbox:
  use: deerflow.sandbox.local:LocalSandboxProvider
  allow_host_bash: false

# WSL mode (Windows only): bash runs inside a WSL2 distro while file I/O
# stays on the Windows filesystem. Host bash is auto-allowed for non-local
# providers, so 'allow_host_bash' is not needed.
# sandbox:
#   use: deerflow.sandbox.local:LocalWslProvider   # short alias: 'wsl'
#   wsl_distro: Ubuntu-22.04          # omit to use the default distro
#   wsl_user: null                    # omit to use the distro's default user
#   wsl_shell: bash
#   wsl_mount_prefix: /mnt

skills:
  enabled: true
  path: ./skills
  container_path: /mnt/skills

memory:
  enabled: true
  storage_path: memory.json
  storage_class: deerflow.agents.memory.storage.FileMemoryStorage
  debounce_seconds: 30
  injection_enabled: true
  max_injection_tokens: 2000

subagents:
  enabled: true
  timeout_seconds: 900
  agents:
    general-purpose:
      description: "A general-purpose sub-agent for delegated tasks"
      model: qwen3.6-plus
      max_turns: 25

tool_groups:
  - name: web
  - name: file:read
  - name: file:write
  - name: bash

# Set https_proxy to null or "" on a web tool to disable proxying for that tool.
tools:
  - name: web_search
    group: web
    use: deerflow.community.brave_search.tools:web_search_tool
    api_key: "YOUR_BRAVE_API_KEY"
    max_results: 5
    https_proxy: http://172.17.0.1:11055
  - name: web_fetch
    group: web
    use: deerflow.community.scrapling.tools:web_fetch_tool
    timeout: 10
    https_proxy: http://172.17.0.1:11055
  - name: image_search
    group: web
    use: deerflow.community.image_search.tools:image_search_tool
    max_results: 5
    https_proxy: http://172.17.0.1:11055
  - name: ls
    group: file:read
    use: deerflow.sandbox.tools:ls_tool
  - name: read_file
    group: file:read
    use: deerflow.sandbox.tools:read_file_tool
  - name: glob
    group: file:read
    use: deerflow.sandbox.tools:glob_tool
    max_results: 200
  - name: grep
    group: file:read
    use: deerflow.sandbox.tools:grep_tool
    max_results: 100
  - name: write_file
    group: file:write
    use: deerflow.sandbox.tools:write_file_tool
  - name: str_replace
    group: file:write
    use: deerflow.sandbox.tools:str_replace_tool
  - name: bash
    group: bash
    use: deerflow.sandbox.tools:bash_tool

guardrails:
  enabled: false
  providers: []

title:
  enabled: true
  model: qwen3.6-plus

summarization:
  enabled: false

tracing:
  enabled: false
  langsmith:
    enabled: false
    # You can set a literal value here or keep credentials in env via $LANGSMITH_API_KEY.
    api_key: null
    project: deer-flow
    endpoint: https://api.smith.langchain.com
  langfuse:
    enabled: false
    # You can set literal values here or keep credentials in env via placeholders.
    public_key: null
    secret_key: null
    host: https://cloud.langfuse.com
